name: Desktop builds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --target ${{ matrix.target }}
      - name: Package portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'FlickVert-portable'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/flickvert.exe' (Join-Path $package 'FlickVert.exe')
          Copy-Item 'README.md','README.ru.md','README.zh-CN.md' $package
          @'
          Run FlickVert.exe. Drag files or folders, then press Shift for conversion, Ctrl for tools, or Alt for file actions. Image tools can combine up to 100 images into a PDF; the actions wheel can create/extract ZIP archives, copy/move selected files and folders to Downloads/FlickVert, or open the selected folder in Windows Terminal (PowerShell is the fallback).

          With FFmpeg installed, the tools wheel also supports video compression, mute, audio extraction, thumbnails, audio compression and loudness normalization.

          The Tools wheel's Edit image opens a local editor for cropping, redaction, text annotations, background fills, brightness and contrast. Edited images are saved as new PNG files beside the originals.

          Files are processed locally. FFmpeg, Pandoc, ImageMagick and LibreOffice are optional and must be installed separately for their formats. Windows 10/11 requires Microsoft Edge WebView2 Runtime.

          FlickVert opens its start window on launch and stays in the tray when the window is closed. The wheel opens beside the pointer while dragging a file. Use the tray menu to reopen settings or quit FlickVert.
          '@ | Set-Content (Join-Path $package 'INSTALL.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'FlickVert-Windows-x64-portable.zip') -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: flickvert-windows-portable
          path: ${{ runner.temp }}/FlickVert-Windows-x64-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flickvert-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flickvert-*
          path: artifacts
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir release-assets
          copy_one() {
            local directory="$1" pattern="$2" destination="$3"
            mapfile -d '' files < <(find "artifacts/$directory" -type f -iname "$pattern" -print0)
            if [[ "${#files[@]}" -ne 1 ]]; then
              echo "Expected one $pattern in artifacts/$directory, found ${#files[@]}" >&2
              exit 1
            fi
            cp "${files[0]}" "release-assets/$destination"
          }
          copy_one flickvert-x86_64-pc-windows-msvc '*.msi' FlickVert-Windows-x64-Setup.msi
          copy_one flickvert-x86_64-pc-windows-msvc '*-setup.exe' FlickVert-Windows-x64-Setup.exe
          copy_one flickvert-windows-portable '*-portable.zip' FlickVert-Windows-x64-Portable.zip
          copy_one flickvert-x86_64-apple-darwin '*.dmg' FlickVert-macOS-Intel.dmg
          copy_one flickvert-aarch64-apple-darwin '*.dmg' FlickVert-macOS-Apple-Silicon.dmg
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            - **Windows:** choose the MSI or setup EXE, or use the portable ZIP. Windows 10/11 x64; WebView2 Runtime is required.
            - **macOS:** choose Apple Silicon or Intel DMG. macOS 13 or later. These builds are not signed or notarized and may show a first-open security warning.
            - Optional conversion engines (FFmpeg, Pandoc, ImageMagick, LibreOffice, Poppler) must be installed separately for the formats that need them.
            - Files are processed locally. See the README files in the portable ZIP for usage and supported formats.

            Verify downloads with `SHA256SUMS.txt`.
          files: release-assets/*
