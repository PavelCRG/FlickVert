name: Desktop builds

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish (for example v0.1.4)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Sync app version to release tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/sync-release-version.mjs $env:RELEASE_TAG
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop application
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}
        run: npm run tauri -- build --target ${{ matrix.target }}
      - name: Build signed update artifacts
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json
      - name: Verify Windows install, reinstall, and uninstall
        if: ${{ runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/v') && inputs.release_tag == '' }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          ./scripts/test-windows-installer.ps1 -Installer $installers[0].FullName
      - name: Verify Windows upgrade from previous release, then uninstall
        if: ${{ runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          $previous = Join-Path $env:RUNNER_TEMP 'FlickVert-previous-release-Setup.exe'
          Invoke-WebRequest 'https://github.com/PavelCRG/FlickVert/releases/latest/download/FlickVert-Windows-x64-Setup.exe' -OutFile $previous
          ./scripts/test-windows-installer.ps1 -Installer $installers[0].FullName -PreviousInstaller $previous
      - name: Package portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'FlickVert-portable'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/flickvert.exe' (Join-Path $package 'FlickVert.exe')
          Copy-Item 'README.md','README.ru.md','README.zh-CN.md' $package
          @'
          Run FlickVert.exe. Drag a file and press Shift for the conversion wheel, Ctrl for tools, or Alt for file actions. Image tools can combine up to 100 images into a PDF; the actions wheel can create/extract ZIP archives, copy/move selected files and folders to Downloads/FlickVert, or open the selected folder in Windows Terminal (PowerShell is the fallback).

          With FFmpeg installed, the tools wheel also supports video compression, mute, audio extraction, thumbnails, audio compression and loudness normalization.

          The Tools wheel's Edit image opens a local editor for cropping, redaction, text annotations, background fills, brightness and contrast. Edited images are saved as new PNG files beside the originals.

          Files are processed locally. FFmpeg, Pandoc, ImageMagick and LibreOffice are optional and must be installed separately for their formats. Windows 10/11 requires Microsoft Edge WebView2 Runtime.

          FlickVert shows Quick start on first launch and opens Settings on later launches. Closing the window keeps FlickVert running in the system tray, so the drag wheel and shortcut remain available. Choose Quit from the tray menu to stop FlickVert. Press Shift while dragging a file to open the conversion wheel; Ctrl opens tools and Alt opens file actions.
          '@ | Set-Content (Join-Path $package 'INSTALL.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'FlickVert-Windows-x64-portable.zip') -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: flickvert-windows-portable
          path: ${{ runner.temp }}/FlickVert-Windows-x64-portable.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: flickvert-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/sync-release-version.mjs "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: flickvert-*
          path: artifacts
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir release-assets
          copy_one() {
            local directory="$1" pattern="$2" destination="$3"
            mapfile -d '' files < <(find "artifacts/$directory" -type f -iname "$pattern" -print0)
            if [[ "${#files[@]}" -ne 1 ]]; then
              echo "Expected one $pattern in artifacts/$directory, found ${#files[@]}" >&2
              exit 1
            fi
            cp "${files[0]}" "release-assets/$destination"
          }
          copy_one flickvert-x86_64-pc-windows-msvc '*.msi' FlickVert-Windows-x64-Setup.msi
          copy_one flickvert-x86_64-pc-windows-msvc '*-setup.exe' FlickVert-Windows-x64-Setup.exe
          copy_one flickvert-windows-portable '*-portable.zip' FlickVert-Windows-x64-Portable.zip
          copy_one flickvert-x86_64-pc-windows-msvc '*-setup.exe.sig' FlickVert-Windows-x64-Setup.exe.sig
          copy_one flickvert-x86_64-pc-windows-msvc '*.msi.sig' FlickVert-Windows-x64-Setup.msi.sig
          node scripts/create-update-manifest.mjs "$RELEASE_TAG"
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          body: |
            <img src="https://raw.githubusercontent.com/PavelCRG/FlickVert/${{ inputs.release_tag || github.ref_name }}/public/fv-file-orange.png" width="96" alt="FlickVert logo">

            ## Download

            - **Windows 10/11 x64:** [Setup](https://github.com/PavelCRG/FlickVert/releases/download/${{ inputs.release_tag || github.ref_name }}/FlickVert-Windows-x64-Setup.exe) · [MSI](https://github.com/PavelCRG/FlickVert/releases/download/${{ inputs.release_tag || github.ref_name }}/FlickVert-Windows-x64-Setup.msi) · [Portable ZIP](https://github.com/PavelCRG/FlickVert/releases/download/${{ inputs.release_tag || github.ref_name }}/FlickVert-Windows-x64-Portable.zip)
            Setup builds check for signed updates at launch and every six hours. Portable builds update manually. Windows may show a SmartScreen warning because the installer is not Authenticode-signed. If updating from an older development build, uninstall it before installing this release.

            Files are processed locally. Optional engines (FFmpeg, Pandoc, ImageMagick, LibreOffice, Poppler) are installed separately. Verify downloads with `SHA256SUMS.txt`.
          files: release-assets/*
