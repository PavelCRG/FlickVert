name: Desktop builds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: flickvert-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flickvert-*
          path: artifacts
          merge-multiple: true
      - name: Collect installers and checksums
        shell: bash
        run: |
          mkdir release-assets
          find artifacts -type f \( -iname '*.msi' -o -iname '*.exe' -o -iname '*.dmg' \) -print0 \
            | while IFS= read -r -d '' file; do cp "$file" release-assets/; done
          test "$(find release-assets -maxdepth 1 -iname '*.msi' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -iname '*setup.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -iname '*.dmg' | wc -l)" -ge 2
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
