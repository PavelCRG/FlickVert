name: Bug report / Сообщить об ошибке
description: Report a reproducible problem with FlickVert
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Reports in English or Russian are welcome. Please do not attach personal files or secrets.
  - type: input
    id: app-version
    attributes:
      label: FlickVert version / Версия FlickVert
      description: Find it in Settings → About.
      placeholder: 0.1.11
    validations:
      required: true
  - type: dropdown
    id: windows-version
    attributes:
      label: Windows version / Версия Windows
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Шаги для повторения
      description: Include the selected file type and installed engine if relevant.
      placeholder: |
        1. Select ...
        2. Choose ...
        3. See the error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / Ожидаемый результат
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / Фактический результат
      placeholder: What happened instead? Include the full error text if available.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional details / Дополнительные сведения
      description: File extension or optional engine version. Do not include private files or secrets.
      render: text
    validations:
      required: false
