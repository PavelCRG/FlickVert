[package]
name = "flickvert"
version = "0.1.10"
description = "Local-first cross-platform file converter"
authors = ["FlickVert"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate-miniz"] }
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "2.7.2"
unicode-normalization = "0.1.25"
tauri-plugin-notification = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
