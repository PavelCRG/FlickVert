[package]
name = "flickvert"
version = "0.1.0"
description = "Локальный конвертер файлов"
authors = ["FlickVert"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
