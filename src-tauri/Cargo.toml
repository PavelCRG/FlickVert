[package]
name = "flickvert"
version = "0.1.11"
description = "Local-first cross-platform file converter"
authors = ["FlickVert"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.4.2", default-features = false, features = ["deflate-miniz"] }
tar = "0.4"
flate2 = "1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "2.7.2"
unicode-normalization = "0.1.25"
tauri-plugin-notification = "2"
image = { version = "0.25.10", default-features = false, features = ["avif", "bmp", "gif", "jpeg", "png", "tiff", "webp"] }
heifer = { version = "=0.4.0", features = ["image"] }
csv = "1.4.0"
rust_xlsxwriter = { version = "0.102.0", default-features = false, features = ["constant_memory"] }
calamine = "0.38.0"
lopdf = { version = "=0.47.0", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
